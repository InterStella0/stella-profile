x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    image: stella-profile-backend:prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      KOFI_VERIFICATION_TOKEN: ${KOFI_VERIFICATION_TOKEN:?set KOFI_VERIFICATION_TOKEN in .env}
      KOFI_CURRENCY: ${KOFI_CURRENCY:-}
      SUPPORTERS_CORS_ORIGINS: ${SUPPORTERS_CORS_ORIGINS:-*}
    volumes:
      - uploads:/uploads
    extra_hosts:
      # lets DATABASE_URL use host.docker.internal for a Postgres on the Docker host (Linux)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/openapi.json')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always
    logging: *logging

  # Production — builds the app and serves it via nginx
  app:
    build:
      context: .
      target: production
    image: stella-profile:prod
    ports:
      - "8083:80"
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

volumes:
  uploads:
