# Rate limit for the public supporter endpoints other sites embed.
# Note: if another reverse proxy sits in front of this one, every client shares
# that proxy's IP here; configure real_ip in that case.
limit_req_zone $binary_remote_addr zone=supporters:10m rate=10r/s;

# Response cache for the public supporter endpoints (top/recent donors).
proxy_cache_path /var/cache/nginx/supporters levels=1:2 keys_zone=supporters_cache:10m
                 max_size=50m inactive=2h use_temp_path=off;

# Keep the original scheme when an outer TLS proxy already set it,
# so SQLAdmin builds https:// asset URLs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # Redirects nginx makes itself use a relative Location, so they keep the
    # host:port the browser used (e.g. :8083) instead of this container's :80.
    absolute_redirect off;

    # Resolve the backend at request time so nginx starts even if it isn't up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # ^~ stops the static-asset regex below from catching these paths
    # (SQLAdmin's CSS/JS and uploaded images must reach the backend).
    location ^~ /api/supporters/ {
        limit_req zone=supporters burst=20 nodelay;
        limit_req_status 429;

        # Cache for 1h regardless of the backend's Cache-Control (which stays
        # max-age=60 for browsers). Origin is in the key because the backend only
        # adds Access-Control-Allow-Origin when the request sends an Origin.
        proxy_cache supporters_cache;
        proxy_cache_key "$request_uri|$http_origin";
        proxy_cache_valid 200 1h;
        proxy_ignore_headers Cache-Control Expires;
        # One request refreshes an expired entry; everyone else gets the stale
        # copy meanwhile (also served if the backend is down).
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass $backend;
    }

    location ^~ /api/ {
        proxy_pass $backend;
    }

    location ^~ /admin {
        proxy_pass $backend;
    }

    location ^~ /uploads/ {
        proxy_pass $backend;
        expires 7d;
    }

    # Serve static assets with long cache
    location ~* \.(js|css|png|svg|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /projects is a client-side page, but public/projects/ (the screenshots) is a
    # real directory, so the fallback below would 301 to /projects/ and then 403.
    location ~ ^/projects/?$ {
        try_files /index.html =404;
    }

    # SPA fallback — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
