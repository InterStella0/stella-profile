services:
  # Production — builds the app and serves it via nginx
  app:
    build:
      context: .
      target: production
    image: stella-profile:prod
    ports:
      - "8083:80"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"