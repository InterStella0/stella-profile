<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img" aria-label="Code repository">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d3a70"/>
      <stop offset="1" stop-color="#5a2450"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#bg)"/>

  <!-- sparkles -->
  <text x="40"  y="44"  font-size="20" fill="#ffcccb" font-style="italic">✦</text>
  <text x="282" y="150" font-size="26" fill="#ffaaa9" font-style="italic">✦</text>
  <text x="270" y="48"  font-size="14" fill="#ffcccb" font-style="italic">✦</text>

  <!-- code window -->
  <rect x="74" y="44" width="172" height="92" rx="12" fill="#f2ead5"/>
  <rect x="74" y="44" width="172" height="24" rx="12" fill="#e4d8b8"/>
  <rect x="74" y="56" width="172" height="12" fill="#e4d8b8"/>
  <circle cx="88"  cy="56" r="4" fill="#ffaaa9"/>
  <circle cx="102" cy="56" r="4" fill="#ffcccb"/>
  <circle cx="116" cy="56" r="4" fill="#6b2d5e" opacity="0.4"/>

  <!-- code lines -->
  <rect x="88"  y="80"  width="44" height="7" rx="3.5" fill="#6b2d5e"/>
  <rect x="138" y="80"  width="64" height="7" rx="3.5" fill="#ffaaa9"/>
  <rect x="98"  y="95"  width="74" height="7" rx="3.5" fill="#c7b9c4"/>
  <rect x="98"  y="110" width="40" height="7" rx="3.5" fill="#ffaaa9"/>
  <rect x="144" y="110" width="34" height="7" rx="3.5" fill="#6b2d5e"/>

  <!-- </> glyph -->
  <text x="160" y="166" font-family="'Nunito', sans-serif" font-size="18"
        font-weight="700" fill="#f2ead5" text-anchor="middle" opacity="0.85">&lt;/&gt;</text>
</svg>
